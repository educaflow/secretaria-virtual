# Configuración de ArchUnit para los tests de arquitectura (com.educaflow.architecture).
#
# Las reglas marcadas como ❌ INCUMPLE en agent_docs/architecture-rules.md se generan
# envueltas en FreezingArchRule.freeze(...). El freezing necesita una "violation store":
# en la PRIMERA ejecución registra las violaciones conocidas y deja el build verde; en
# las siguientes solo falla ante violaciones NUEVAS.
#
# Por defecto la store no se crea sola (lanza StoreInitializationFailedException). Estas
# propiedades permiten crearla y la ubican junto a los tests para poder versionarla.
freeze.store.default.allowStoreCreation=true
freeze.store.default.path=src/test/resources/archunit_store

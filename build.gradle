buildscript {
    // PlantUML para la tarea GenerateDocs (renderizado de diagramas *.plantuml/*.puml).
    repositories { mavenCentral() }
    dependencies { classpath 'net.sourceforge.plantuml:plantuml:1.2025.4' }
}
plugins {
    id 'com.axelor.app' version '8.1.1-SNAPSHOT'
    id 'idea'
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
}
configurations { educaFlowBuildToolsDependency }
dependencies   { educaFlowBuildToolsDependency 'com.educaflow:EducaFlowBuildTools:1.0-SNAPSHOT' }



group = 'com.educaflow'
version = '0.0.1'

axelor {
    title = 'secretaria-virtual'
}

def isProduccion = project.hasProperty('environment') && project.environment == 'produccion'


//Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget =  org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.named("compileKotlin") {
    dependsOn(tasks.named("generateCode"))
    destinationDirectory.set(file("build/classes/java/main"))
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}



dependencies {
    implementation 'com.itextpdf:kernel:9.2.0'
    implementation 'com.itextpdf:layout:9.2.0'
    implementation 'com.itextpdf:forms:9.2.0'
    implementation 'com.itextpdf:pdfa:9.2.0'
    implementation 'com.itextpdf:sign:9.2.0'
    implementation 'com.itextpdf:bouncy-castle-adapter:9.2.0'
    implementation 'com.itextpdf:commons:9.2.0'
    implementation 'de.vandermeer:asciitable:0.3.2'
    implementation 'org.verapdf:core:1.28.1'
    implementation 'org.verapdf:validation-model:1.28.1'
    implementation 'org.verapdf:validation-model-jakarta:1.28.1'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'org.flywaydb:flyway-core:11.19.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"

    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
}

//Test
afterEvaluate {
    configurations {
        // Exclusión de JUnit 4 para asegurar el uso exclusivo de JUnit 5
        testImplementation.exclude group: 'junit', module: 'junit'
        testImplementation.exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    test {
        // Forzar el uso de la plataforma JUnit 5
        useJUnitPlatform()
        beforeTest { descriptor ->
            logger.lifecycle('Running: ' + descriptor)
        }
    }
}


tasks.register('injectBuildInfo') {
    description = 'Inyecta rama, fecha y hash de git en axelor-config.properties del build.'
    group = 'build'
    dependsOn 'processResources'
    // Sin outputs declarados → siempre se ejecuta

    doLast {
        def gitBranch = ['git', 'rev-parse', '--abbrev-ref', 'HEAD'].execute().text.trim()
        def gitHash   = ['git', 'rev-parse', '--short', 'HEAD'].execute().text.trim()
        def buildDate = new Date().format('yyyy-MM-dd HH:mm:ss')

        // Leemos siempre del fuente original para evitar acumulación de cambios
        def sourceContent = file('src/main/resources/axelor-config.properties').text
        def newFooter = "application.sign-in.footer = Esta aplicaci\\u00F3n est\\u00E1 en pruebas. | Rama: ${gitBranch} | Fecha: ${buildDate} | Commit: ${gitHash}"

        layout.buildDirectory.file('resources/main/axelor-config.properties').get().asFile.text =
            sourceContent.replaceAll(/(?m)^application\.sign-in\.footer\s*=.*$/) { newFooter }
    }
}

war {
    archiveFileName = 'secretariavirtual.war'
    dependsOn 'injectBuildInfo'
}
jar {
    enabled = false
}

tasks.named('run') {
    dependsOn 'injectBuildInfo'
}

tasks.register('viewProcessorTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo después de procesar los fichero de las vistas (form) de los expedientes.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.viewprocessor.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main/views'

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('processResources') {
    finalizedBy 'viewProcessorTask'
}
tasks.register('managei18nfiles', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo después de generar y procesar los fichero i18n.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.i18nprocessor.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main/i18n', 'apertium'

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('processResources') {
    finalizedBy 'managei18nfiles'
}
tasks.register('copyDataInit') {
    description = 'Copia las carpetas "data-init" (las que contienen input-config.xml) y su subcarpeta input de cada expediente.'
    group = 'build'

    doLast {
        def srcRoot = file('src/main/java')
        def destRoot = file('build/resources/main/java-data-init')
        srcRoot.traverse(type: groovy.io.FileType.DIRECTORIES, nameFilter: 'data-init') { dir ->
            if (new File(dir, 'input-config.xml').isFile()) {
                def rel = srcRoot.toPath().relativize(dir.toPath()).toString()
                copy {
                    from(dir) {
                        include 'input-config.xml'
                        include 'input/**'
                    }
                    into new File(destRoot, rel)
                }
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'copyDataInit'
}
tasks.register('copyDomain', Copy) {
    description = 'Copia los ficheros de dominio de Axelor (root <domain-models> en el namespace axelor) a java-domain.'
    group = 'build'

    from('src/main/java') { include '**/*.xml' }
    into 'build/resources/main/java-domain'
    includeEmptyDirs = false

    // Solo se copian los XML cuyo elemento raíz es <domain-models> en el namespace de Axelor.
    eachFile { fcd ->
        def root = new XmlSlurper(false, true).parse(fcd.file)
        if (root.name() != 'domain-models' ||
            root.namespaceURI() != 'http://axelor.com/xml/ns/domain-models') {
            fcd.exclude()
        }
    }
}
tasks.named('build') {
    finalizedBy 'copyDomain'
}

tasks.register('copySQL', Copy) {
    description = 'Copia los ficheros SQL de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.sql' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copySQL'
}


tasks.register('generateDataInitTiposExpedientes', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para generar los ficheros de "data-init" de los tipos de expediente.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createdatainittipoexpediente.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main'

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('build') {
    finalizedBy 'generateDataInitTiposExpedientes'
}
tasks.register('generateDataInitTramites') {
    description = 'Genera los data-init de cada trámite (definición con priority="1" y tipo de expediente activo con priority="-1") a partir de su TramiteInstance.xml.'
    group = 'build'

    doLast {
        def srcRoot = file('src/main/java')
        def destRoot = file('build/resources/main/tramites')
        destRoot.deleteDir()

        def esc = { String s -> s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;') }

        srcRoot.traverse(type: groovy.io.FileType.FILES, nameFilter: 'TramiteInstance.xml') { xmlFile ->
            def tramite = new XmlSlurper().parse(xmlFile)
            def code = tramite['code'].text().trim()
            def name = tramite['name'].text().trim()
            def tipoTramite = tramite['tipoTramite'].text().trim()
            def defaultTipoExpediente = tramite['defaultTipoExpediente'].text().trim()
            def help = tramite['help'].text()

            if (!code || !name || !tipoTramite) {
                throw new GradleException("TramiteInstance.xml sin code/name/tipoTramite: ${xmlFile}")
            }
            if (help.contains(']]>')) {
                throw new GradleException("El <help> no puede contener ']]>': ${xmlFile}")
            }
            println "Encontrado Tramite instancia:${name} en ${xmlFile}"

            // publico/privado solo se emiten si el TramiteInstance.xml los declara
            def atributosOpcionales = ''
            ['publico', 'privado'].each { attr ->
                if (tramite[attr].size() > 0) {
                    atributosOpcionales += "${attr}=\"${esc(tramite[attr].text().trim())}\" "
                }
            }

            def definicionDataInit = new File(destRoot, "${code}/definicion/data-init")
            new File(definicionDataInit, 'input').mkdirs()
            new File(definicionDataInit, 'input-config.xml').setText('''\
<?xml version="1.0"?>
<xml-inputs priority="1" xmlns="http://axelor.com/xml/ns/data-import"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://axelor.com/xml/ns/data-import
  https://axelor.com/xml/ns/data-import/data-import_8.0.xsd">

    <input file="Tramite.xml" root="datos">

        <bind node="tramites/tramite" type="com.educaflow.subsystem.expedientes.db.Tramite" search="self.code = :code" create="true" update="true">
            <bind node="@code" to="code" />
            <bind node="@name" to="name" />
            <bind node="@publico" to="publico" />
            <bind node="@privado" to="privado" />
            <bind node="@tipoTramite" to="tipoTramite" alias="tipoTramite" search="self.code = :tipoTramite"  create="false" update="true" />
            <bind node="text()" to="help" />
        </bind>

    </input>

</xml-inputs>
''', 'UTF-8')
            new File(definicionDataInit, 'input/Tramite.xml').setText("""\
<?xml version="1.0"?>
<datos>
    <tramites>
        <tramite code="${esc(code)}" name="${esc(name)}" ${atributosOpcionales}tipoTramite="${esc(tipoTramite)}"><![CDATA[${help}]]></tramite>
    </tramites>
</datos>
""", 'UTF-8')

            // defaultTipoExpediente puede ser el nombre de la carpeta del tipo (v1, v2...): se resuelve
            // a su code con la misma regla que EducaFlowBuildTools (el <code> declarado en su
            // TipoExpedienteInstance.xml o, si falta, code del trámite + carpeta en mayúsculas)
            if (defaultTipoExpediente) {
                def tipoExpedienteXml = new File(xmlFile.parentFile, "${defaultTipoExpediente}/TipoExpedienteInstance.xml")
                if (tipoExpedienteXml.exists()) {
                    def codeDeclarado = new XmlSlurper().parse(tipoExpedienteXml)['code'].text().trim()
                    defaultTipoExpediente = codeDeclarado ?: code + defaultTipoExpediente.toUpperCase()
                }
            }

            if (defaultTipoExpediente) {
                def activoDataInit = new File(destRoot, "${code}/tipo_expediente_activo/data-init")
                new File(activoDataInit, 'input').mkdirs()
                new File(activoDataInit, 'input-config.xml').setText('''\
<?xml version="1.0"?>
<xml-inputs priority="-1" xmlns="http://axelor.com/xml/ns/data-import"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://axelor.com/xml/ns/data-import
  https://axelor.com/xml/ns/data-import/data-import_8.0.xsd">

    <input file="TipoExpedienteActivo.xml" root="datos">

        <bind node="tramites/tramite" type="com.educaflow.subsystem.expedientes.db.Tramite" search="self.code = :code" update="true" create="false" >
            <bind node="@code" to="code" />
            <bind node="@defaultTipoExpediente" to="defaultTipoExpediente" alias="tipoExpediente" search="self.code = :tipoExpediente"  create="false" update="true" />
        </bind>
    </input>

</xml-inputs>
''', 'UTF-8')
                new File(activoDataInit, 'input/TipoExpedienteActivo.xml').setText("""\
<?xml version="1.0"?>
<datos>
    <tramites>
        <tramite code="${esc(code)}" defaultTipoExpediente="${esc(defaultTipoExpediente)}" />
    </tramites>
</datos>
""", 'UTF-8')
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'generateDataInitTramites'
}
tasks.register('copiarPdf', Copy) {
    description = 'Copia los ficheros PDF de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.pdf' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copiarPdf'
}

tasks.register('copiarXsd', Copy) {
    description = 'Copia los ficheros XSD de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.xsd' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copiarXsd'
}

tasks.register('RichDomainClassTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para añadir código al modelo con los enumerados de estados, eventos y profiles.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.richdomainclass.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/src-gen/main/java'

    workingDir = layout.projectDirectory.dir('.')

    inputs.dir(layout.projectDirectory.dir('./src/main/java'))
    outputs.dir(layout.buildDirectory.dir('./build/src-gen/main/java'))
}
tasks.named('generateCode') {
    finalizedBy tasks.RichDomainClassTask
}
tasks.register('RichDomainXmlTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para añadir código al xml del modelo antes de que genere el código.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.richdomainclass.MainModelXml'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/src-gen/main/java'

    workingDir = layout.projectDirectory.dir('.')

    inputs.dir(layout.projectDirectory.dir('./src/main/java'))
    outputs.dir(layout.buildDirectory.dir('./build/src-gen/main/java'))
}
tasks.named('generateCode') {
    dependsOn tasks.RichDomainXmlTask
}

tasks.register('CreateFilesTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para generar o validar los ficheros de un tipo de expediente.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createfiles.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java'

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('generateCode') {
    dependsOn tasks.CreateFilesTask
}
tasks.register('GenerateDocs') {
    description = 'Genera diagramas PNG a partir de los ficheros PlantUML (*.plantuml, *.puml) bajo src.'
    group = 'build'

    doLast {
        file('src').traverse(type: groovy.io.FileType.FILES) { f ->
            def name = f.name
            if (name.endsWith('.plantuml') || name.endsWith('.puml')) {
                def png = new File(f.parentFile, name.replaceFirst(/\.(plantuml|puml)$/, '.png'))
                if (png.exists() && png.lastModified() >= f.lastModified()) {
                    println "UML Diagram actualizado, se omite:${png}"
                    return
                }
                def source = f.getText('UTF-8')
                if (!source.contains('@startuml')) source = '@startuml\n' + source
                if (!source.contains('@enduml'))   source = source + '\n\n@enduml'
                println "Generando UML Diagram en:${png}"
                png.withOutputStream { os ->
                    new net.sourceforge.plantuml.SourceStringReader(source).outputImage(os)
                }
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'GenerateDocs'
}

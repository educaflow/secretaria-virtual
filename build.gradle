buildscript {
    // PlantUML para la tarea GenerateDocs (renderizado de diagramas *.plantuml/*.puml).
    repositories { mavenCentral() }
    dependencies { classpath 'net.sourceforge.plantuml:plantuml:1.2025.4' }
}
plugins {
    id 'com.axelor.app' version '8.1.1-SNAPSHOT'
    id 'idea'
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
}
configurations { educaFlowBuildToolsDependency }
dependencies   { educaFlowBuildToolsDependency 'com.educaflow:EducaFlowBuildTools:1.0-SNAPSHOT' }



group = 'com.educaflow'
version = '0.0.1'

axelor {
    title = 'secretaria-virtual'
}

def isProduccion = project.hasProperty('environment') && project.environment == 'produccion'

// Paquete raíz de los trámites: los TramiteInstance.xml y los TipoExpedienteInstance.xml
// se descubren a cualquier profundidad por debajo de él (las carpetas intermedias son
// solo de agrupación). Va como último argumento de las herramientas de
// EducaFlowBuildTools que descubren trámites o tipos de expediente.
def paqueteRaizTramites = 'com.educaflow.tramites'


//Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget =  org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.named("compileKotlin") {
    dependsOn(tasks.named("generateCode"))
    destinationDirectory.set(file("build/classes/java/main"))
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}



dependencies {
    implementation 'com.itextpdf:kernel:9.2.0'
    implementation 'com.itextpdf:layout:9.2.0'
    implementation 'com.itextpdf:forms:9.2.0'
    implementation 'com.itextpdf:pdfa:9.2.0'
    implementation 'com.itextpdf:sign:9.2.0'
    implementation 'com.itextpdf:bouncy-castle-adapter:9.2.0'
    implementation 'com.itextpdf:commons:9.2.0'
    implementation 'de.vandermeer:asciitable:0.3.2'
    implementation 'org.verapdf:core:1.28.1'
    implementation 'org.verapdf:validation-model:1.28.1'
    implementation 'org.verapdf:validation-model-jakarta:1.28.1'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'org.flywaydb:flyway-core:11.19.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"

    //Envio de correos con google
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20220404-2.0.0'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.2'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.0'

    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    // Los tests de com.educaflow.tiposexpedientes leen los TipoExpedienteInstance.xml con el MISMO
    // código que usa el generador (TramitesLayout, TipoExpedienteInstanceFileFinder) y renderizan
    // el snippet del método que falta con sus MISMAS plantillas: así test y generador no pueden
    // discrepar sobre cómo se deriva el code, los eventos o el nombre de cada método.
    // Sin transitivas: de todo lo que declara ese JAR (fop, verapdf, opencsv, postgresql…) los tests
    // solo necesitan JAXB para leer el XML y Pebble para renderizar el snippet; arrastrar el resto
    // engorda el classpath de compilación de los tests hasta hacer reventar de memoria al compilador.
    testImplementation('com.educaflow:EducaFlowBuildTools:1.0-SNAPSHOT') { transitive = false }
    testImplementation 'io.pebbletemplates:pebble:3.2.4'
    testImplementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    testRuntimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.0'
}

//Test
afterEvaluate {
    configurations {
        // Exclusión de JUnit 4 para asegurar el uso exclusivo de JUnit 5
        testImplementation.exclude group: 'junit', module: 'junit'
        testImplementation.exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    test {
        // Forzar el uso de la plataforma JUnit 5
        useJUnitPlatform()
        beforeTest { descriptor ->
            logger.lifecycle('Running: ' + descriptor)
        }
        testLogging {
            // Sin esto la consola solo dice "AssertionFailedError at XxxTest.java:NN" y se traga el
            // mensaje del assert, que es donde estos tests ponen el diagnóstico (qué falta, en qué
            // fichero y el código listo para pegar). Sin stacktrace: aquí no aporta nada.
            events 'failed'
            exceptionFormat = 'full'
            showStackTraces = false
        }
    }
}


tasks.register('injectBuildInfo') {
    description = 'Inyecta rama, fecha y hash de git en axelor-config.properties del build.'
    group = 'build'
    dependsOn 'processResources'
    // Sin outputs declarados → siempre se ejecuta

    doLast {
        def gitBranch = ['git', 'rev-parse', '--abbrev-ref', 'HEAD'].execute().text.trim()
        def gitHash   = ['git', 'rev-parse', '--short', 'HEAD'].execute().text.trim()
        def buildDate = new Date().format('yyyy-MM-dd HH:mm:ss')

        // Leemos siempre del fuente original para evitar acumulación de cambios
        def sourceContent = file('src/main/resources/axelor-config.properties').text
        def newFooter = "application.sign-in.footer = Esta aplicaci\\u00F3n est\\u00E1 en pruebas. | Rama: ${gitBranch} | Fecha: ${buildDate} | Commit: ${gitHash}"

        layout.buildDirectory.file('resources/main/axelor-config.properties').get().asFile.text =
                sourceContent.replaceAll(/(?m)^application\.sign-in\.footer\s*=.*$/) { newFooter }
    }
}

war {
    archiveFileName = 'secretariavirtual.war'
    dependsOn 'injectBuildInfo'
}
jar {
    enabled = false
}

tasks.named('run') {
    dependsOn 'injectBuildInfo'
}

tasks.register('viewProcessorTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo después de procesar los fichero de las vistas (form) de los expedientes.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.viewprocessor.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main/views', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('processResources') {
    finalizedBy 'viewProcessorTask'
}
tasks.register('managei18nfiles', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo después de generar y procesar los fichero i18n.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.i18nprocessor.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main/i18n', 'apertium', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('processResources') {
    finalizedBy 'managei18nfiles'
}
tasks.register('generatePdfDocuments', JavaExec) {
    description = 'Genera los PDF de los documentos de los trámites (XML con raíz <documento> en carpetas documentospdf/documentos, sin prefijo "_") en build/src-gen/main/resources.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.xml2pdf.Main'

    classpath = configurations.educaFlowBuildToolsDependency

    args './src/main/java', './build/src-gen/main/resources', 'apertium', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')
}
// dependsOn (no finalizedBy): build/src-gen/main/resources es un srcDir de
// recursos, así que los PDF deben existir ANTES de que processResources los
// copie a build/resources/main.
tasks.named('processResources') {
    dependsOn 'generatePdfDocuments'
}
tasks.register('copyDataInit') {
    description = 'Copia las carpetas "data-init" (las que contienen input-config.xml) y su subcarpeta input de cada expediente.'
    group = 'build'

    doLast {
        def srcRoot = file('src/main/java')
        def destRoot = file('build/resources/main/java-data-init')
        srcRoot.traverse(type: groovy.io.FileType.DIRECTORIES, nameFilter: 'data-init') { dir ->
            if (new File(dir, 'input-config.xml').isFile()) {
                def rel = srcRoot.toPath().relativize(dir.toPath()).toString()
                copy {
                    from(dir) {
                        include 'input-config.xml'
                        include 'input/**'
                    }
                    into new File(destRoot, rel)
                }
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'copyDataInit'
}
tasks.register('copyDomain', Copy) {
    description = 'Copia los ficheros de dominio de Axelor (root <domain-models> en el namespace axelor) a java-domain.'
    group = 'build'

    from('src/main/java') { include '**/*.xml' }
    into 'build/resources/main/java-domain'
    includeEmptyDirs = false

    // Solo se copian los XML cuyo elemento raíz es <domain-models> en el namespace de Axelor.
    eachFile { fcd ->
        def root = new XmlSlurper(false, true).parse(fcd.file)
        if (root.name() != 'domain-models' ||
                root.namespaceURI() != 'http://axelor.com/xml/ns/domain-models') {
            fcd.exclude()
        }
    }
}
tasks.named('build') {
    finalizedBy 'copyDomain'
}

tasks.register('copySQL', Copy) {
    description = 'Copia los ficheros SQL de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.sql' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copySQL'
}


tasks.register('generateDataInitTiposExpedientes', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para generar los ficheros de "data-init" de los tipos de expediente.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createdatainittipoexpediente.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('build') {
    finalizedBy 'generateDataInitTiposExpedientes'
}
tasks.register('generateDataInitTramites', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para generar los ficheros de "data-init" de los trámites (definición con priority="1" y tipo de expediente activo con priority="-1").'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createdatainittramite.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/resources/main', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')
}
tasks.named('build') {
    finalizedBy 'generateDataInitTramites'
}
tasks.register('copiarPdf', Copy) {
    description = 'Copia los ficheros PDF de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.pdf' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copiarPdf'
}

tasks.register('copiarXsd', Copy) {
    description = 'Copia los ficheros XSD de src/main/java a resources, preservando la estructura.'
    group = 'build'

    from('src/main/java') { include '**/*.xsd' }
    into 'build/resources/main'
    includeEmptyDirs = false
}
tasks.named('build') {
    finalizedBy 'copiarXsd'
}

tasks.register('RichDomainClassTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para añadir código al modelo con los enumerados de estados, eventos y profiles.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.richdomainclass.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/src-gen/main/java', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')

    inputs.dir(layout.projectDirectory.dir('./src/main/java'))
    outputs.dir(layout.buildDirectory.dir('./build/src-gen/main/java'))
}
tasks.named('generateCode') {
    finalizedBy tasks.RichDomainClassTask
}
tasks.register('RichDomainXmlTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para añadir código al xml del modelo antes de que genere el código.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.richdomainclass.MainModelXml'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', './build/src-gen/main/java', paqueteRaizTramites

    workingDir = layout.projectDirectory.dir('.')

    inputs.dir(layout.projectDirectory.dir('./src/main/java'))
    outputs.dir(layout.buildDirectory.dir('./build/src-gen/main/java'))
}
tasks.named('generateCode') {
    dependsOn tasks.RichDomainXmlTask
}

// Genera la clase States de cada tipo de expediente (la proyección tipada de su
// TipoExpedienteInstance.xml). NO es un esqueleto: se reemite entera en cada build, así que no se
// versiona ni vive en src/main/java.
tasks.register('GenerateStatesTask', JavaExec) {
    description = 'Genera la clase States de cada tipo de expediente a partir de su TipoExpedienteInstance.xml.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createstates.Main'
    classpath = configurations.educaFlowBuildToolsDependency

    args './src/main/java', './build/src-gen-states/main/java', paqueteRaizTramites, './src/main/java/com/educaflow/subsystem/expedientes/domains/TipoExpediente.xml'

    workingDir = layout.projectDirectory.dir('.')

    // La raíz de salida se vacía antes de emitir: un States.java huérfano (tipo borrado, carpeta
    // renombrada) es puro y seguiría compilando en silencio en un build incremental.
    doFirst { delete(layout.buildDirectory.dir('src-gen-states')) }

    // Inputs acotados a lo que la tarea lee: los TipoExpedienteInstance.xml y el
    // domains/TipoExpediente.xml del que sale el enum global Profile (sin él, renombrar un perfil
    // dejaría la tarea up-to-date y esa validación sin re-ejecutar). Los outputs van a una raíz
    // PROPIA (no build/src-gen) para no solapar con lo que escriben generateCode y
    // RichDomainClassTask, que confundiría los up-to-date checks de Gradle.
    inputs.files(fileTree(layout.projectDirectory.dir('src/main/java/' + paqueteRaizTramites.replace('.', '/'))) { include '**/TipoExpedienteInstance.xml' })
    inputs.file('src/main/java/com/educaflow/subsystem/expedientes/domains/TipoExpediente.xml')
    outputs.dir(layout.buildDirectory.dir('src-gen-states/main/java'))
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir('src-gen-states/main/java'))
tasks.named('compileJava')   { dependsOn tasks.GenerateStatesTask }
tasks.named('compileKotlin') { dependsOn tasks.GenerateStatesTask }

// Generador de los esqueletos de un tipo de expediente (domains.xml, views.xml, PhaseEventManagerImpl.java,
// StateEventValidatorImpl.kt). Se invoca a mano al crear un tipo de expediente:
//
//   ./gradlew -q CreateFilesTask -Ptipo=src/main/java/com/educaflow/tramites/<tramite>/<vN>
//
// NO cuelga de generateCode a propósito, para que compilar no escriba en src/main/java. Los cuatro
// ficheros se versionan en git, así que el build solo los echaría de menos en la ventana entre
// escribir el TipoExpedienteInstance.xml y generarlos; si eso pasa, RichDomainXmlTask falla diciendo
// qué domains.xml falta.
tasks.register('CreateFilesTask', JavaExec) {
    description = 'Ejecuta una clase Java desde un JAR externo para generar los ficheros de un tipo de expediente.'
    group = 'build'

    mainClass = 'com.educaflow.common.buildtools.createfiles.Main'

    classpath = configurations.educaFlowBuildToolsDependency


    args './src/main/java', paqueteRaizTramites

    // -Ptipo=<ruta> acota la generación a un único tipo de expediente (la ruta de su
    // TipoExpedienteInstance.xml o la de la carpeta que lo contiene). Sin él se procesan todos.
    if (project.hasProperty('tipo')) {
        args "--tipo=${project.property('tipo')}"
    }

    // -Pfase=<FASE> acota además la generación a una sola fase. Con -Pfase no se generan los
    // ficheros de la raíz de la versión (domains.xml y views.xml), porque no son de ninguna fase en
    // concreto. Solo tiene sentido junto con -Ptipo: sin él se aplica a todos los tipos y aborta a
    // medias en el primero que no tenga esa fase. NO hace falta para añadir una fase nueva sin tocar
    // las que ya están: el generador es idempotente y sin -Pfase crea igualmente solo lo que falta.
    if (project.hasProperty('fase')) {
        args "--fase=${project.property('fase')}"
    }

    workingDir = layout.projectDirectory.dir('.')
}
tasks.register('GenerateDocs') {
    description = 'Genera diagramas PNG a partir de los ficheros PlantUML (*.plantuml, *.puml) bajo src.'
    group = 'build'

    doLast {
        file('src').traverse(type: groovy.io.FileType.FILES) { f ->
            def name = f.name
            if (name.endsWith('.plantuml') || name.endsWith('.puml')) {
                def png = new File(f.parentFile, name.replaceFirst(/\.(plantuml|puml)$/, '.png'))
                if (png.exists() && png.lastModified() >= f.lastModified()) {
                    println "UML Diagram actualizado, se omite:${png}"
                    return
                }
                def source = f.getText('UTF-8')
                if (!source.contains('@startuml')) source = '@startuml\n' + source
                if (!source.contains('@enduml'))   source = source + '\n\n@enduml'
                println "Generando UML Diagram en:${png}"
                png.withOutputStream { os ->
                    new net.sourceforge.plantuml.SourceStringReader(source).outputImage(os)
                }
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'GenerateDocs'
}

# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=false


# Memoria del daemon de Gradle. Sin esto arranca con 512 MiB de heap y el build puede morir a mitad de la
# tarea test con "Gradle build daemon has been stopped: since the JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

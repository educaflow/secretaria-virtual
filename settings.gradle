pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral() {
            content {
                excludeGroup 'com.axelor'
            }
        }
    }
    resolutionStrategy {
        eachPlugin {
            // El plugin de PIT (mutation testing) solo publica su "plugin marker" en el Gradle Plugin
            // Portal, que no está entre los repositorios; el artefacto real sí está en Maven Central,
            // así que se mapea aquí el id del plugin a su módulo.
            if (requested.id.id == 'info.solidsoft.pitest') {
                useModule("info.solidsoft.gradle.pitest:gradle-pitest-plugin:${requested.version}")
            }
        }
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral() {
            content {
                excludeGroup 'com.axelor'
            }
        }
        // Declare the Node.js download repository
        ivy {
            name = "Node.js"
            setUrl("https://nodejs.org/dist/")
            patternLayout {
                artifact("v[revision]/[artifact](-v[revision]-[classifier]).[ext]")
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("org.nodejs", "node")
            }
        }
    }
}

rootProject.name = 'secretaria-virtual'

